# 4 demo service instances (2 datacenters x 2 pods), VictoriaMetrics scraping them,
# Grafana with the datasource wired in, the one-shot grafana-token-bootstrap and
# dashboard-generator, and the loadgen background load.

name: ddia-hw1

x-service-common: &service-common
  build:
    context: .
    dockerfile: service/Dockerfile
  image: ddia-hw1/service:0.1.0
  restart: unless-stopped
  networks: [hw1]
  healthcheck:
    # The service endpoint that depends_on: service_healthy watches.
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 15s

x-service-env: &service-env
  INSTANCE_DEPLOYMENT: ${INSTANCE_DEPLOYMENT:-hw1-demo-service}
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx256m}

services:

  # ---------- demo service: 2 datacenters x 2 pods ----------
  # Env values differ per instance so the dashboard selectors are meaningful.

  service-dc-a-1:
    <<: *service-common
    container_name: hw1-service-dc-a-1
    environment:
      <<: *service-env
      INSTANCE_DATACENTER: dc-a
      INSTANCE_POD: pod-1
    ports: ["18081:8080"]

  service-dc-a-2:
    <<: *service-common
    container_name: hw1-service-dc-a-2
    environment:
      <<: *service-env
      INSTANCE_DATACENTER: dc-a
      INSTANCE_POD: pod-2
    ports: ["18082:8080"]

  service-dc-b-1:
    <<: *service-common
    container_name: hw1-service-dc-b-1
    environment:
      <<: *service-env
      INSTANCE_DATACENTER: dc-b
      INSTANCE_POD: pod-1
    ports: ["18083:8080"]

  service-dc-b-2:
    <<: *service-common
    container_name: hw1-service-dc-b-2
    environment:
      <<: *service-env
      INSTANCE_DATACENTER: dc-b
      INSTANCE_POD: pod-2
    ports: ["18084:8080"]

  # ---------- metrics storage ----------

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0
    container_name: hw1-victoriametrics
    restart: unless-stopped
    networks: [hw1]
    command:
      - -promscrape.config=/etc/victoriametrics/scrape.yml
      - -storageDataPath=/vmdata
      - -retentionPeriod=7d
      - -httpListenAddr=:8428
    volumes:
      - ./infra/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
      - vm-data:/vmdata
    ports: ["8428:8428"]

  # ---------- Grafana ----------

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: hw1-grafana
    restart: unless-stopped
    networks: [hw1]
    depends_on:
      victoriametrics: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # The password is read from a file rather than env, so the secret stays out of inspect and image history.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # ---------- automation: token, dashboard generation, load ----------

  # Service account and token for the dashboard generator.
  # The admin password arrives as a docker secret and the issued token goes into a volume,
  # so neither of them ever appears in this file.

  grafana-token-bootstrap:
    build:
      context: .
      dockerfile: dashboard-generator/Dockerfile
    image: ddia-hw1/dashboard-generator:0.1.0
    container_name: hw1-grafana-token-bootstrap
    networks: [hw1]
    restart: "no"
    depends_on:
      grafana: { condition: service_healthy }
    command: ["ru.itmo.ddia.hw1.dashboards.TokenBootstrap"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      GRAFANA_SA_TOKEN_FILE: /run/grafana-token/token
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-sa-token:/run/grafana-token

  # Dashboard generator.
  # Starts after the health probe of the target application and after the bootstrap
  # has successfully issued the token.

  dashboard-generator:
    build:
      context: .
      dockerfile: dashboard-generator/Dockerfile
    image: ddia-hw1/dashboard-generator:0.1.0
    container_name: hw1-dashboard-generator
    networks: [hw1]
    restart: "no"
    depends_on:
      grafana-token-bootstrap: { condition: service_completed_successfully }
      service-dc-a-1: { condition: service_healthy }
      service-dc-a-2: { condition: service_healthy }
      service-dc-b-1: { condition: service_healthy }
      service-dc-b-2: { condition: service_healthy }
    command: ["ru.itmo.ddia.hw1.dashboards.DashboardGenerator"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_DATASOURCE_UID: victoriametrics
      GRAFANA_SA_TOKEN_FILE: /run/grafana-token/token
      # The handler list is taken at runtime from a live instance.
      TARGET_SERVICE_URL: http://service-dc-a-1:8080
    volumes:
      - grafana-sa-token:/run/grafana-token:ro

  # Background load with a configured share of errors.
  # Starts last: after the health probe of every instance and after the generator
  # has uploaded the dashboard.

  loadgen:
    build:
      context: .
      dockerfile: loadgen/Dockerfile
    image: ddia-hw1/loadgen:0.1.0
    container_name: hw1-loadgen
    networks: [hw1]
    restart: unless-stopped
    depends_on:
      dashboard-generator: { condition: service_completed_successfully }
      service-dc-a-1: { condition: service_healthy }
      service-dc-a-2: { condition: service_healthy }
      service-dc-b-1: { condition: service_healthy }
      service-dc-b-2: { condition: service_healthy }
    environment:
      TARGETS: http://service-dc-a-1:8080,http://service-dc-a-2:8080,http://service-dc-b-1:8080,http://service-dc-b-2:8080
      TARGET_RPS: ${LOAD_TARGET_RPS:-40}
      RAMP_UP_STEPS: ${LOAD_RAMP_UP_STEPS:-5}
      RAMP_UP_STEP_SECONDS: ${LOAD_RAMP_UP_STEP_SECONDS:-30}
      # Share of requests bound to fail: 404 for an unknown id, 400 for an invalid body.
      ERROR_RATE: ${LOAD_ERROR_RATE:-0.15}

networks:
  hw1:
    driver: bridge

volumes:
  vm-data:
  grafana-data:
  grafana-sa-token:

secrets:
  grafana_admin_password:
    file: ./.secrets/grafana_admin_password